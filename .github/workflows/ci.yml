
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      is_java: ${{ steps.detect.outputs.is_java }}
      is_node: ${{ steps.detect.outputs.is_node }}
      is_python: ${{ steps.detect.outputs.is_python }}
      node_pm: ${{ steps.detect.outputs.node_pm }}
      java_build_tool: ${{ steps.detect.outputs.java_build_tool }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          is_java=false
          is_node=false
          is_python=false
          node_pm="npm"
          java_build_tool="maven"

          has_file_named() {
            local filename="$1"
            find . -path './.git' -prune -o -type f -name "$filename" -print -quit | grep -q .
          }

          # Java detection
          if has_file_named "pom.xml" || has_file_named "mvnw"; then
            is_java=true
            java_build_tool="maven"
          elif has_file_named "build.gradle" || has_file_named "build.gradle.kts" || has_file_named "gradlew"; then
            is_java=true
            java_build_tool="gradle"
          fi

          # Node/React detection
          if has_file_named "package.json"; then
            is_node=true
            if has_file_named "pnpm-lock.yaml"; then
              node_pm="pnpm"
            elif has_file_named "yarn.lock"; then
              node_pm="yarn"
            else
              node_pm="npm"
            fi
          fi

          # Python detection
          if has_file_named "pyproject.toml" || has_file_named "requirements.txt"; then
            is_python=true
          fi

          echo "is_java=$is_java" >> "$GITHUB_OUTPUT"
          echo "is_node=$is_node" >> "$GITHUB_OUTPUT"
          echo "is_python=$is_python" >> "$GITHUB_OUTPUT"
          echo "node_pm=$node_pm" >> "$GITHUB_OUTPUT"
          echo "java_build_tool=$java_build_tool" >> "$GITHUB_OUTPUT"

  java:
    name: Java (lint/test)
    needs: detect
    if: needs.detect.outputs.is_java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ needs.detect.outputs.java_build_tool }}

      - name: Maven test
        if: needs.detect.outputs.java_build_tool == 'maven'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./mvnw" ]; then chmod +x ./mvnw && ./mvnw -q test; else mvn -q test; fi

      - name: Gradle test
        if: needs.detect.outputs.java_build_tool == 'gradle'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then chmod +x ./gradlew && ./gradlew test; else gradle test; fi

  node:
    name: Node/React (lint/test/build)
    needs: detect
    if: needs.detect.outputs.is_node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (npm/yarn cache)
        if: needs.detect.outputs.node_pm != 'pnpm'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ needs.detect.outputs.node_pm }}

      - name: Setup Node (pnpm no cache)
        if: needs.detect.outputs.node_pm == 'pnpm'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        if: needs.detect.outputs.node_pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ needs.detect.outputs.node_pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          # If no lint script, skip
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            case "${{ needs.detect.outputs.node_pm }}" in
              pnpm) pnpm lint ;;
              yarn) yarn lint ;;
              npm)  npm run lint ;;
            esac
          else
            echo "No lint script found; skipping."
          fi

      - name: Test
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          case "${{ needs.detect.outputs.node_pm }}" in
            pnpm) pnpm test ;;
            yarn) yarn test ;;
            npm)  npm test ;;
          esac

      - name: Build (if script exists)
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            case "${{ needs.detect.outputs.node_pm }}" in
              pnpm) pnpm build ;;
              yarn) yarn build ;;
              npm)  npm run build ;;
            esac
          else
            echo "No build script found; skipping."
          fi

  python:
    name: Python (ruff/pytest)
    needs: detect
    if: needs.detect.outputs.is_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then
            python -m pip install -e .[dev] || python -m pip install -e .
            python -m pip install ruff pytest httpx
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
            python -m pip install ruff pytest httpx
          else
            python -m pip install ruff pytest httpx
          fi

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          ruff check . || (echo "ruff failed" && exit 1)

      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build

  summary:
    name: CI summary
    needs: [detect, java, node, python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Result
        shell: bash
        run: |
          set -euo pipefail
          echo "CI completed."

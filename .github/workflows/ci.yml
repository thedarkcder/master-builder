
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      is_java: ${{ steps.detect.outputs.is_java }}
      is_node: ${{ steps.detect.outputs.is_node }}
      is_python: ${{ steps.detect.outputs.is_python }}
      node_pm: ${{ steps.detect.outputs.node_pm }}
      java_build_tool: ${{ steps.detect.outputs.java_build_tool }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          is_java=false
          is_node=false
          is_python=false
          node_pm="npm"
          java_build_tool="maven"

          # Java detection
          if ls pom.xml */pom.xml >/dev/null 2>&1 || ls mvnw */mvnw >/dev/null 2>&1; then
            is_java=true
            java_build_tool="maven"
          elif ls build.gradle build.gradle.kts */build.gradle */build.gradle.kts >/dev/null 2>&1 || ls gradlew */gradlew >/dev/null 2>&1; then
            is_java=true
            java_build_tool="gradle"
          fi

          # Node/React detection
          if ls package.json */package.json >/dev/null 2>&1; then
            is_node=true
            if ls pnpm-lock.yaml */pnpm-lock.yaml >/dev/null 2>&1; then
              node_pm="pnpm"
            elif ls yarn.lock */yarn.lock >/dev/null 2>&1; then
              node_pm="yarn"
            else
              node_pm="npm"
            fi
          fi

          # Python detection
          if ls pyproject.toml */pyproject.toml requirements.txt */requirements.txt >/dev/null 2>&1; then
            is_python=true
          fi

          echo "is_java=$is_java" >> "$GITHUB_OUTPUT"
          echo "is_node=$is_node" >> "$GITHUB_OUTPUT"
          echo "is_python=$is_python" >> "$GITHUB_OUTPUT"
          echo "node_pm=$node_pm" >> "$GITHUB_OUTPUT"
          echo "java_build_tool=$java_build_tool" >> "$GITHUB_OUTPUT"

  java:
    name: Java (lint/test)
    needs: detect
    if: needs.detect.outputs.is_java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ needs.detect.outputs.java_build_tool }}

      - name: Maven test
        if: needs.detect.outputs.java_build_tool == 'maven'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./mvnw" ]; then chmod +x ./mvnw && ./mvnw -q test; else mvn -q test; fi

      - name: Gradle test
        if: needs.detect.outputs.java_build_tool == 'gradle'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then chmod +x ./gradlew && ./gradlew test; else gradle test; fi

  node:
    name: Node/React (lint/test)
    needs: detect
    if: needs.detect.outputs.is_node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ needs.detect.outputs.node_pm }}

      - name: Setup pnpm
        if: needs.detect.outputs.node_pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ needs.detect.outputs.node_pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          # If no lint script, skip
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            case "${{ needs.detect.outputs.node_pm }}" in
              pnpm) pnpm lint ;;
              yarn) yarn lint ;;
              npm)  npm run lint ;;
            esac
          else
            echo "No lint script found; skipping."
          fi

      - name: Test
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          case "${{ needs.detect.outputs.node_pm }}" in
            pnpm) pnpm test ;;
            yarn) yarn test ;;
            npm)  npm test ;;
          esac

  python:
    name: Python (ruff/pytest)
    needs: detect
    if: needs.detect.outputs.is_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then
            # Best-effort: if using poetry/uv it may differ; keep v1 simple.
            python -m pip install -e . || true
            python -m pip install ruff pytest
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
            python -m pip install ruff pytest
          else
            python -m pip install ruff pytest
          fi

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          ruff check . || (echo "ruff failed" && exit 1)

      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

  summary:
    name: CI summary
    needs: [detect, java, node, python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Result
        shell: bash
        run: |
          set -euo pipefail
          echo "CI completed."

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.DS_Store|\.env|\.env\.local)$|\.(pem|key|p12|log|pid)$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden tracked files:\n%s\n' "$forbidden"
            exit 1
          fi
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

  python:
    name: Python checks and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.24'
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Generate isolated test signing keys
        run: |
          uv run --frozen python - <<'PY'
          import os
          import secrets
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('ADMIN_PASSWORD', 'ADMIN_TOKEN_SECRET', 'AUTH_TOKEN_SECRET'):
                  output.write(f'ORCHESTRATOR_{name}={secrets.token_urlsafe(48)}\n')
              output.write(f'ORCHESTRATOR_SECRETS_ENCRYPTION_KEY={Fernet.generate_key().decode()}\n')
          PY
      - name: Python lint
        run: uv run --frozen ruff check orchestrator tests scripts
      - name: Python formatting
        run: uv run --frozen ruff format --check orchestrator tests scripts
      - name: Quality policies
        run: |
          uv run --frozen python scripts/quality/check_compat_shims.py
          uv run --frozen python scripts/quality/check_dead_code.py
          uv run --frozen python scripts/quality/check_no_todo_markers.py
      - name: Changed-line Python review
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: uv run --frozen python scripts/quality/check_ruff_changed_lines.py
      - name: Full Python test suite
        run: uv run --frozen pytest --cov=orchestrator --cov-report=term-missing --cov-report=xml
      - name: Build distribution
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  postgres-rls:
    name: Isolated PostgreSQL tenant isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.24'
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Verify RLS using a disposable loopback PostgreSQL container
        run: uv run --frozen python scripts/verify_postgres_rls.py

  administration-ui:
    name: UI types, build and mocked browser behavior
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_TRUST_HOST: 'true'
      ORCHESTRATOR_API_BASE_URL: 'http://localhost:60001'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Generate isolated browser session key
        run: printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Configuration unit tests
        run: npm run test:unit
      - name: Type checking
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Mocked frontend behavior suite
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            admin-ui/playwright-report/
            admin-ui/test-results/
          if-no-files-found: ignore

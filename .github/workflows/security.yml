name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect SAST languages
    runs-on: ubuntu-latest
    outputs:
      codeql_languages: ${{ steps.detect.outputs.codeql_languages }}
      is_python: ${{ steps.detect.outputs.is_python }}
      is_node: ${{ steps.detect.outputs.is_node }}
    steps:
      - uses: actions/checkout@v5

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_file_pattern() {
            local pattern="$1"
            local found
            found="$(find . -path './.git' -prune -o -type f -name "$pattern" -print -quit)"
            [ -n "$found" ]
          }

          languages=()
          is_python=false
          is_node=false

          if has_file_pattern "*.py"; then
            languages+=("python")
            is_python=true
          fi
          if has_file_pattern "*.js" || has_file_pattern "*.jsx" || has_file_pattern "*.ts" || has_file_pattern "*.tsx"; then
            languages+=("javascript-typescript")
            is_node=true
          fi
          if has_file_pattern "*.java" || has_file_pattern "*.kt" || has_file_pattern "*.kts"; then
            languages+=("java-kotlin")
          fi

          if [ ${#languages[@]} -eq 0 ]; then
            echo "codeql_languages=" >> "$GITHUB_OUTPUT"
          else
            codeql_languages=$(IFS=,; echo "${languages[*]}")
            echo "codeql_languages=$codeql_languages" >> "$GITHUB_OUTPUT"
          fi

          echo "is_python=$is_python" >> "$GITHUB_OUTPUT"
          echo "is_node=$is_node" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    needs: detect
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  python-dependency-audit:
    name: Python dependency audit
    needs: detect
    if: needs.detect.outputs.is_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.24'

      - name: Export frozen runtime dependencies
        run: uv export --frozen --no-emit-project --no-dev --no-default-groups --no-hashes --format requirements.txt --output-file /tmp/runtime-requirements.txt

      - name: Audit frozen runtime dependencies
        run: uv tool run --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --strict --progress-spinner off --requirement /tmp/runtime-requirements.txt

  node-dependency-audit:
    name: UI lockfile dependency audit
    needs: detect
    if: needs.detect.outputs.is_node == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        package: [admin-ui, public-site]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Audit committed lockfile
        run: npm audit --package-lock-only

  gitleaks:
    name: Secret scanning (gitleaks)
    needs: detect
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI is MIT licensed; organization action licensing is unnecessary.
      # https://github.com/gitleaks/gitleaks/blob/v8.30.1/LICENSE
      # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
      - name: Run checksum-verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf -- "$tool_dir"' EXIT
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --show-error --silent --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
          python3 scripts/verify_secret_scanner.py --gitleaks "$tool_dir/gitleaks"
          "$tool_dir/gitleaks" git --config .gitleaks.toml \
            --log-opts="--all --full-history --reflog" \
            --ignore-gitleaks-allow --redact=100 --no-banner .

  codeql:
    name: SAST (CodeQL)
    needs: detect
    if: needs.detect.outputs.codeql_languages != '' && vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.detect.outputs.codeql_languages }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

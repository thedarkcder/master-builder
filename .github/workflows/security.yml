name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect SAST languages
    runs-on: ubuntu-latest
    outputs:
      codeql_languages: ${{ steps.detect.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          languages=()
          py_files=( **/*.py )
          js_files=( **/*.js **/*.jsx **/*.ts **/*.tsx )
          java_files=( **/*.java **/*.kt **/*.kts )

          if [ ${#py_files[@]} -gt 0 ]; then
            languages+=("python")
          fi
          if [ ${#js_files[@]} -gt 0 ]; then
            languages+=("javascript-typescript")
          fi
          if [ ${#java_files[@]} -gt 0 ]; then
            languages+=("java-kotlin")
          fi

          if [ ${#languages[@]} -eq 0 ]; then
            echo "codeql_languages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          codeql_languages=$(IFS=,; echo "${languages[*]}")
          echo "codeql_languages=$codeql_languages" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    needs: detect
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gitleaks:
    name: Secret scanning (gitleaks)
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: "" # not required for OSS usage
        with:
          # If you want a repo-specific config later:
          # config-path: .gitleaks.toml
          args: detect --redact --verbose --no-git

  codeql:
    name: SAST (CodeQL)
    needs: detect
    if: needs.detect.outputs.codeql_languages != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.detect.outputs.codeql_languages }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

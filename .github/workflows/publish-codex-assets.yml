name: Publish Codex Assets

on:
  push:
    branches: [staging, main]
    paths:
      - ".codex/**"
      - "scripts/build_codex_assets_package.sh"
      - ".github/workflows/publish-codex-assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-codex-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect codex assets version bump
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      assets_version: ${{ steps.detect.outputs.assets_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so github.event.before is always resolvable on multi-commit pushes.
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          assets_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path(".codex/codex_assets_manifest.json").read_text(encoding="utf-8"))["assets_version"])')"
          echo "assets_version=${assets_version}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -z "${before_sha}" ] || [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_manifest="$(git show "${before_sha}:.codex/codex_assets_manifest.json" 2>/dev/null || true)"
          if [ -z "${previous_manifest}" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(printf '%s' "${previous_manifest}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["assets_version"])')"
          if [ "${previous_version}" = "${assets_version}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish codex assets release
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build wheel

      - name: Resolve publish channel/version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          base_version="${{ needs.detect.outputs.assets_version }}"
          branch="${GITHUB_REF_NAME}"

          if [ "${branch}" = "staging" ]; then
            publish_channel="beta"
            publish_version="${base_version}b${GITHUB_RUN_NUMBER}"
            prerelease="true"
          else
            publish_channel="stable"
            publish_version="${base_version}"
            prerelease="false"
          fi

          echo "publish_channel=${publish_channel}" >> "$GITHUB_OUTPUT"
          echo "publish_version=${publish_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Build codex assets package
        env:
          CODEX_ASSETS_PACKAGE_VERSION: ${{ steps.release.outputs.publish_version }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_codex_assets_package.sh
          scripts/build_codex_assets_package.sh dist/codex-assets

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-assets-${{ steps.release.outputs.publish_version }}
          path: dist/codex-assets/*

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="codex-assets-v${{ steps.release.outputs.publish_version }}"
          title="Codex assets v${{ steps.release.outputs.publish_version }} (${{ steps.release.outputs.publish_channel }})"
          prerelease="${{ steps.release.outputs.prerelease }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/codex-assets/* --clobber
          else
            create_args=("${tag}" dist/codex-assets/* --title "${title}" --notes "Automated codex assets package release.")
            if [ "${prerelease}" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Publish to Python package index
        if: vars.CODEX_ASSETS_PUBLISH_TO_INDEX == 'true'
        env:
          TWINE_USERNAME: ${{ vars.CODEX_ASSETS_PUBLISH_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.CODEX_ASSETS_PUBLISH_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ vars.CODEX_ASSETS_PUBLISH_REPOSITORY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TWINE_REPOSITORY_URL:-}" ]; then
            echo "CODEX_ASSETS_PUBLISH_REPOSITORY_URL is required when CODEX_ASSETS_PUBLISH_TO_INDEX=true."
            exit 1
          fi

          # GitHub Packages on github.com does not support Python package uploads.
          if [[ "${TWINE_REPOSITORY_URL}" == *"pkg.github.com"* ]]; then
            echo "Invalid CODEX_ASSETS_PUBLISH_REPOSITORY_URL: GitHub Packages Python registry is not supported on github.com."
            echo "Use PyPI/TestPyPI (e.g. https://upload.pypi.org/legacy/ or https://test.pypi.org/legacy/)."
            exit 1
          fi

          if [ -z "${TWINE_USERNAME:-}" ]; then
            TWINE_USERNAME="__token__"
          fi
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "CODEX_ASSETS_PUBLISH_PASSWORD secret is required when CODEX_ASSETS_PUBLISH_TO_INDEX=true."
            exit 1
          fi

          python -m pip install --upgrade twine
          # GitHub Packages does not support twine's --skip-existing flag.
          python -m twine upload --repository-url "${TWINE_REPOSITORY_URL}" dist/codex-assets/*

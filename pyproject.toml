[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "master-builder"
version = "0.1.0"
description = "Multi-tenant agent orchestrator service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "psycopg[binary]>=3.2.0",
  "PyJWT>=2.8.0",
  "pydantic-settings>=2.5.0",
  "sentry-sdk[fastapi]>=2.14.0",
  "sqlalchemy>=2.0.34",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["orchestrator"]
omit = [
  "orchestrator/storage/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["prompts/**/*.j2"]

services:
  api:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: master-builder-api
    environment:
      ORCHESTRATOR_ADMIN_USERNAME: ${ORCHESTRATOR_ADMIN_USERNAME:-admin}
      ORCHESTRATOR_ADMIN_PASSWORD: ${ORCHESTRATOR_ADMIN_PASSWORD:-change-me}
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-sqlite:////app/data/orchestrator.db}
      ORCHESTRATOR_CORS_ORIGINS: ${ORCHESTRATOR_CORS_ORIGINS:-http://localhost:4080,http://127.0.0.1:4080}
      ORCHESTRATOR_PUBLIC_API_BASE_URL: ${ORCHESTRATOR_PUBLIC_API_BASE_URL:-http://localhost:4080}
      ORCHESTRATOR_ADMIN_UI_BASE_URL: ${ORCHESTRATOR_ADMIN_UI_BASE_URL:-http://localhost:4080}
    ports:
      - "4000:4000"
    volumes:
      - orchestrator-data:/app/data

  worker:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: master-builder-worker
    depends_on:
      - api
    environment:
      ORCHESTRATOR_ADMIN_USERNAME: ${ORCHESTRATOR_ADMIN_USERNAME:-admin}
      ORCHESTRATOR_ADMIN_PASSWORD: ${ORCHESTRATOR_ADMIN_PASSWORD:-change-me}
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-sqlite:////app/data/orchestrator.db}
    command: ["sh", "-c", "python -m orchestrator migrate && python -m orchestrator worker"]
    volumes:
      - orchestrator-data:/app/data

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: master-builder-admin-ui
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4080}
    ports:
      - "4100:4100"

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: master-builder-reverse-proxy
    depends_on:
      - api
      - admin-ui
    ports:
      - "4080:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: master-builder-cloudflared
    depends_on:
      - reverse-proxy
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --url
      - http://reverse-proxy:8080

volumes:
  orchestrator-data:

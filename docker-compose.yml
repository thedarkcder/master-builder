# Lets containers reach services bound on the Docker host (e.g. LM Studio on :1234).
# Use base_url like http://host.docker.internal:1234 in agent runtime profiles, not the LAN IP.
x-extra_hosts_host_gateway: &extra_hosts_host_gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-otel-env: &otel_env
  ORCHESTRATOR_OTEL_ENABLED: ${ORCHESTRATOR_OTEL_ENABLED:-true}
  ORCHESTRATOR_OTEL_SERVICE_NAMESPACE: ${ORCHESTRATOR_OTEL_SERVICE_NAMESPACE:-master-builder}
  ORCHESTRATOR_OTEL_EXPORTER_OTLP_ENDPOINT: ${ORCHESTRATOR_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  ORCHESTRATOR_OTEL_TRACES_SAMPLE_RATIO: ${ORCHESTRATOR_OTEL_TRACES_SAMPLE_RATIO:-1.0}
  ORCHESTRATOR_CLICKHOUSE_HTTP_URL: ${ORCHESTRATOR_CLICKHOUSE_HTTP_URL:-http://clickhouse:8123}
  ORCHESTRATOR_CLICKHOUSE_DATABASE: ${ORCHESTRATOR_CLICKHOUSE_DATABASE:-master_builder}
  ORCHESTRATOR_CLICKHOUSE_USERNAME: ${ORCHESTRATOR_CLICKHOUSE_USERNAME:-master_builder}
  ORCHESTRATOR_CLICKHOUSE_PASSWORD: ${ORCHESTRATOR_CLICKHOUSE_PASSWORD:-master_builder}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: master-builder-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
    ports:
      - "${MASTER_BUILDER_POSTGRES_PORT:-60003}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator} && psql -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator} -tAc 'select not pg_is_in_recovery()' | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.5
    container_name: master-builder-mailpit
    ports:
      - "${MASTER_BUILDER_MAILPIT_SMTP_PORT:-60004}:1025"
      - "${MASTER_BUILDER_MAILPIT_UI_PORT:-60005}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: master-builder-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-masterbuilder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-masterbuildersecret}
    command: server /data --console-address ":9001"
    ports:
      - "${MASTER_BUILDER_MINIO_API_PORT:-60015}:9000"
      - "${MASTER_BUILDER_MINIO_CONSOLE_PORT:-60016}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: master-builder-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-masterbuilder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-masterbuildersecret}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET:-qa-demos}
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET}"
        mc anonymous set download "local/$${ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET}"

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: master-builder-clickhouse
    environment:
      CLICKHOUSE_DB: ${ORCHESTRATOR_CLICKHOUSE_DATABASE:-master_builder}
      CLICKHOUSE_USER: ${ORCHESTRATOR_CLICKHOUSE_USERNAME:-master_builder}
      CLICKHOUSE_PASSWORD: ${ORCHESTRATOR_CLICKHOUSE_PASSWORD:-master_builder}
    ports:
      - "${MASTER_BUILDER_CLICKHOUSE_HTTP_PORT:-60006}:8123"
      - "${MASTER_BUILDER_CLICKHOUSE_NATIVE_PORT:-60007}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./ops/observability/clickhouse/users.d/master-builder-user.xml:/etc/clickhouse-server/users.d/master-builder-user.xml:ro

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: master-builder-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-orchestrator}
    ports:
      - "${MASTER_BUILDER_TEMPORAL_PORT:-60008}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "IP=$$(hostname -i | awk '{print $$1}'); nc -z \"$$IP\" 7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    <<: *extra_hosts_host_gateway
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: app-runtime-base
      args:
        CODEX_NPM_VERSION: ${CODEX_NPM_VERSION:-latest}
    container_name: master-builder-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
    command:
      - python
      - -m
      - orchestrator
      - migrate

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    container_name: master-builder-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${MASTER_BUILDER_OTEL_GRPC_PORT:-60009}:4317"
      - "${MASTER_BUILDER_OTEL_HTTP_PORT:-60010}:4318"
      - "${MASTER_BUILDER_OTEL_METRICS_PORT:-60011}:9464"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.1
    container_name: master-builder-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./ops/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${MASTER_BUILDER_TEMPO_PORT:-60012}:3200"

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: master-builder-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${MASTER_BUILDER_PROMETHEUS_PORT:-60013}:9090"
    depends_on:
      - api
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    container_name: master-builder-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ORG_ROLE:-Viewer}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MASTER_BUILDER_GRAFANA_PORT:-60014}:3000"
    depends_on:
      - prometheus
      - tempo
      - clickhouse

  api:
    <<: *extra_hosts_host_gateway
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: app-runtime-base
      args:
        CODEX_NPM_VERSION: ${CODEX_NPM_VERSION:-latest}
    container_name: master-builder-api
    environment:
      <<: *otel_env
      ORCHESTRATOR_ADMIN_USERNAME: ${ORCHESTRATOR_ADMIN_USERNAME:-admin}
      ORCHESTRATOR_ADMIN_PASSWORD: ${ORCHESTRATOR_ADMIN_PASSWORD:?Set ORCHESTRATOR_ADMIN_PASSWORD}
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      ORCHESTRATOR_CORS_ORIGINS: ${ORCHESTRATOR_CORS_ORIGINS:-http://localhost:${MASTER_BUILDER_ADMIN_UI_PORT:-60002},http://127.0.0.1:${MASTER_BUILDER_ADMIN_UI_PORT:-60002}}
      ORCHESTRATOR_CORS_ORIGIN_REGEX: ${ORCHESTRATOR_CORS_ORIGIN_REGEX:-}
      ORCHESTRATOR_PUBLIC_API_BASE_URL: ${ORCHESTRATOR_PUBLIC_API_BASE_URL:-http://localhost:${MASTER_BUILDER_API_PORT:-60001}}
      ORCHESTRATOR_ADMIN_UI_BASE_URL: ${ORCHESTRATOR_ADMIN_UI_BASE_URL:-http://localhost:${MASTER_BUILDER_ADMIN_UI_PORT:-60002}}
      ORCHESTRATOR_DISCORD_OAUTH_CLIENT_ID: ${ORCHESTRATOR_DISCORD_OAUTH_CLIENT_ID:-}
      ORCHESTRATOR_DISCORD_OAUTH_CLIENT_SECRET: ${ORCHESTRATOR_DISCORD_OAUTH_CLIENT_SECRET:-}
      ORCHESTRATOR_DISCORD_OAUTH_REDIRECT_URL: ${ORCHESTRATOR_DISCORD_OAUTH_REDIRECT_URL:-}
      ORCHESTRATOR_CODEX_SANDBOX_MODE: ${ORCHESTRATOR_CODEX_SANDBOX_MODE:-danger-full-access}
      ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET: ${ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET:?Set ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET}
      ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET: ${ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET:?Set ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET}
      ORCHESTRATOR_EMAIL_DELIVERY_PROVIDER: ${ORCHESTRATOR_EMAIL_DELIVERY_PROVIDER:-smtp}
      ORCHESTRATOR_EMAIL_FROM_NAME: ${ORCHESTRATOR_EMAIL_FROM_NAME:-Master Builder}
      ORCHESTRATOR_EMAIL_FROM_ADDRESS: ${ORCHESTRATOR_EMAIL_FROM_ADDRESS:-no-reply@masterbuilder.local}
      ORCHESTRATOR_SMTP_HOST: ${ORCHESTRATOR_SMTP_HOST:-mailpit}
      ORCHESTRATOR_SMTP_PORT: ${ORCHESTRATOR_SMTP_PORT:-1025}
      ORCHESTRATOR_SMTP_USERNAME: ${ORCHESTRATOR_SMTP_USERNAME:-}
      ORCHESTRATOR_SMTP_PASSWORD: ${ORCHESTRATOR_SMTP_PASSWORD:-}
      ORCHESTRATOR_SMTP_USE_TLS: ${ORCHESTRATOR_SMTP_USE_TLS:-false}
      ORCHESTRATOR_SMTP_USE_SSL: ${ORCHESTRATOR_SMTP_USE_SSL:-false}
      ORCHESTRATOR_SECRETS_ENCRYPTION_KEY: ${ORCHESTRATOR_SECRETS_ENCRYPTION_KEY:?Set ORCHESTRATOR_SECRETS_ENCRYPTION_KEY}
      ORCHESTRATOR_SENTRY_DSN: ${ORCHESTRATOR_SENTRY_DSN:-}
      ORCHESTRATOR_SENTRY_ENVIRONMENT: ${ORCHESTRATOR_SENTRY_ENVIRONMENT:-dev}
      ORCHESTRATOR_SENTRY_RELEASE: ${ORCHESTRATOR_SENTRY_RELEASE:-}
      ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE: ${ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_PROJECT_REPO_CHECKOUT_BASE_DIR: /tmp/master-builder-project-repos
      ORCHESTRATOR_WORKER_CAPABILITIES: ${ORCHESTRATOR_WORKER_CAPABILITIES:-linux}
      ORCHESTRATOR_API_WORKERS: ${ORCHESTRATOR_API_WORKERS:-4}
      ORCHESTRATOR_UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS: ${ORCHESTRATOR_UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS:-180}
      ORCHESTRATOR_ORCHESTRATION_BACKEND: ${ORCHESTRATOR_ORCHESTRATION_BACKEND:-legacy}
      ORCHESTRATOR_TEMPORAL_TARGET_HOST: ${ORCHESTRATOR_TEMPORAL_TARGET_HOST:-temporal:7233}
      ORCHESTRATOR_TEMPORAL_NAMESPACE: ${ORCHESTRATOR_TEMPORAL_NAMESPACE:-default}
      ORCHESTRATOR_TEMPORAL_TASK_QUEUE: ${ORCHESTRATOR_TEMPORAL_TASK_QUEUE:-master-builder}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_PUBLIC_BASE_URL: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_PUBLIC_BASE_URL:-http://127.0.0.1:60015/qa-demos}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_URL_TIMEOUT_SECONDS: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_URL_TIMEOUT_SECONDS:-10}
    ports:
      - "${MASTER_BUILDER_API_PORT:-60001}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import json,sys,urllib.request; data=json.loads(urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=10).read().decode()); sys.exit(0 if data.get('status') == 'ok' else 1)"
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 15s
    command:
      - /bin/sh
      - -ceu
      - |
        if [ -f /app/AGENTS.md ]; then cp /app/AGENTS.md /root/AGENTS.md; fi
        uvicorn orchestrator.api.main:app --host 0.0.0.0 --port 4000 --workers "${ORCHESTRATOR_API_WORKERS:-4}" --timeout-worker-healthcheck "${ORCHESTRATOR_UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS:-180}"
    volumes:
      - codex-home:/root/.codex
      - ./.workdirs:/tmp/master-builder-project-repos
        
  run-worker:
    <<: *extra_hosts_host_gateway
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: android-runtime
      args:
        CODEX_NPM_VERSION: ${CODEX_NPM_VERSION:-latest}
    container_name: master-builder-run-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      <<: *otel_env
      ORCHESTRATOR_ADMIN_USERNAME: ${ORCHESTRATOR_ADMIN_USERNAME:-admin}
      ORCHESTRATOR_ADMIN_PASSWORD: ${ORCHESTRATOR_ADMIN_PASSWORD:?Set ORCHESTRATOR_ADMIN_PASSWORD}
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      ORCHESTRATOR_PUBLIC_API_BASE_URL: ${ORCHESTRATOR_PUBLIC_API_BASE_URL:-http://localhost:${MASTER_BUILDER_API_PORT:-60001}}
      ORCHESTRATOR_ADMIN_UI_BASE_URL: ${ORCHESTRATOR_ADMIN_UI_BASE_URL:-http://localhost:${MASTER_BUILDER_ADMIN_UI_PORT:-60002}}
      ORCHESTRATOR_CODEX_SANDBOX_MODE: ${ORCHESTRATOR_CODEX_SANDBOX_MODE:-danger-full-access}
      ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET: ${ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET:?Set ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET}
      ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET: ${ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET:?Set ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET}
      ORCHESTRATOR_SECRETS_ENCRYPTION_KEY: ${ORCHESTRATOR_SECRETS_ENCRYPTION_KEY:?Set ORCHESTRATOR_SECRETS_ENCRYPTION_KEY}
      ORCHESTRATOR_SENTRY_DSN: ${ORCHESTRATOR_SENTRY_DSN:-}
      ORCHESTRATOR_SENTRY_ENVIRONMENT: ${ORCHESTRATOR_SENTRY_ENVIRONMENT:-dev}
      ORCHESTRATOR_SENTRY_RELEASE: ${ORCHESTRATOR_SENTRY_RELEASE:-}
      ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE: ${ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_PROJECT_REPO_CHECKOUT_BASE_DIR: /tmp/master-builder-project-repos
      ORCHESTRATOR_WORKER_CAPABILITIES: ${ORCHESTRATOR_WORKER_CAPABILITIES:-linux}
      ORCHESTRATOR_ORCHESTRATION_BACKEND: ${ORCHESTRATOR_ORCHESTRATION_BACKEND:-legacy}
      ORCHESTRATOR_TEMPORAL_TARGET_HOST: ${ORCHESTRATOR_TEMPORAL_TARGET_HOST:-temporal:7233}
      ORCHESTRATOR_TEMPORAL_NAMESPACE: ${ORCHESTRATOR_TEMPORAL_NAMESPACE:-default}
      ORCHESTRATOR_TEMPORAL_TASK_QUEUE: ${ORCHESTRATOR_TEMPORAL_TASK_QUEUE:-master-builder}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_ENDPOINT: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_ENDPOINT_INTERNAL:-minio:9000}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_ACCESS_KEY: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_ACCESS_KEY:-masterbuilder}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_SECRET_KEY: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_SECRET_KEY:-masterbuildersecret}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_BUCKET:-qa-demos}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_PUBLIC_BASE_URL: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_PUBLIC_BASE_URL:-http://127.0.0.1:60015/qa-demos}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_SECURE: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_SECURE:-false}
      ORCHESTRATOR_QA_DEMO_RECORDER_PROCESS_TIMEOUT_SECONDS: ${ORCHESTRATOR_QA_DEMO_RECORDER_PROCESS_TIMEOUT_SECONDS:-900}
      ORCHESTRATOR_QA_DEMO_RELEASE_HEALTH_TIMEOUT_SECONDS: ${ORCHESTRATOR_QA_DEMO_RELEASE_HEALTH_TIMEOUT_SECONDS:-10}
      ORCHESTRATOR_QA_DEMO_ARTIFACT_URL_TIMEOUT_SECONDS: ${ORCHESTRATOR_QA_DEMO_ARTIFACT_URL_TIMEOUT_SECONDS:-10}
      ORCHESTRATOR_QA_DEMO_IOS_RECORDER_COMMAND: ${ORCHESTRATOR_QA_DEMO_IOS_RECORDER_COMMAND:-}
      ORCHESTRATOR_QA_DEMO_IOS_CAPTURE_REFERENCE: ${ORCHESTRATOR_QA_DEMO_IOS_CAPTURE_REFERENCE:-}
      ORCHESTRATOR_QA_DEMO_ANDROID_RECORDER_COMMAND: ${ORCHESTRATOR_QA_DEMO_ANDROID_RECORDER_COMMAND:-}
      ORCHESTRATOR_QA_DEMO_ANDROID_CAPTURE_REFERENCE: ${ORCHESTRATOR_QA_DEMO_ANDROID_CAPTURE_REFERENCE:-}
      ORCHESTRATOR_QA_DEMO_ANDROID_WORKER_PLATFORM: ${ORCHESTRATOR_QA_DEMO_ANDROID_WORKER_PLATFORM:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    command:
      - /bin/sh
      - -ceu
      - |
        if [ -f /app/AGENTS.md ]; then cp /app/AGENTS.md /root/AGENTS.md; fi
        HF_HUB_OFFLINE=0 python -m orchestrator knowledge-prewarm
        python -m orchestrator worker-runs
    volumes:
      - codex-home:/root/.codex
      - ./.workdirs:/tmp/master-builder-project-repos
      - huggingface-cache:/root/.cache/huggingface

  webhook-worker:
    <<: *extra_hosts_host_gateway
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      target: voice-runtime
      args:
        CODEX_NPM_VERSION: ${CODEX_NPM_VERSION:-latest}
    container_name: master-builder-webhook-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      <<: *otel_env
      ORCHESTRATOR_ADMIN_USERNAME: ${ORCHESTRATOR_ADMIN_USERNAME:-admin}
      ORCHESTRATOR_ADMIN_PASSWORD: ${ORCHESTRATOR_ADMIN_PASSWORD:?Set ORCHESTRATOR_ADMIN_PASSWORD}
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator}
      ORCHESTRATOR_PUBLIC_API_BASE_URL: ${ORCHESTRATOR_PUBLIC_API_BASE_URL:-http://localhost:${MASTER_BUILDER_API_PORT:-60001}}
      ORCHESTRATOR_ADMIN_UI_BASE_URL: ${ORCHESTRATOR_ADMIN_UI_BASE_URL:-http://localhost:${MASTER_BUILDER_ADMIN_UI_PORT:-60002}}
      ORCHESTRATOR_CODEX_SANDBOX_MODE: ${ORCHESTRATOR_CODEX_SANDBOX_MODE:-danger-full-access}
      ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET: ${ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET:?Set ORCHESTRATOR_GITHUB_INSTALL_STATE_SECRET}
      ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET: ${ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET:?Set ORCHESTRATOR_JIRA_OAUTH_STATE_SECRET}
      ORCHESTRATOR_EMAIL_DELIVERY_PROVIDER: ${ORCHESTRATOR_EMAIL_DELIVERY_PROVIDER:-smtp}
      ORCHESTRATOR_EMAIL_FROM_NAME: ${ORCHESTRATOR_EMAIL_FROM_NAME:-Master Builder}
      ORCHESTRATOR_EMAIL_FROM_ADDRESS: ${ORCHESTRATOR_EMAIL_FROM_ADDRESS:-no-reply@masterbuilder.local}
      ORCHESTRATOR_SMTP_HOST: ${ORCHESTRATOR_SMTP_HOST:-mailpit}
      ORCHESTRATOR_SMTP_PORT: ${ORCHESTRATOR_SMTP_PORT:-1025}
      ORCHESTRATOR_SMTP_USERNAME: ${ORCHESTRATOR_SMTP_USERNAME:-}
      ORCHESTRATOR_SMTP_PASSWORD: ${ORCHESTRATOR_SMTP_PASSWORD:-}
      ORCHESTRATOR_SMTP_USE_TLS: ${ORCHESTRATOR_SMTP_USE_TLS:-false}
      ORCHESTRATOR_SMTP_USE_SSL: ${ORCHESTRATOR_SMTP_USE_SSL:-false}
      ORCHESTRATOR_SECRETS_ENCRYPTION_KEY: ${ORCHESTRATOR_SECRETS_ENCRYPTION_KEY:?Set ORCHESTRATOR_SECRETS_ENCRYPTION_KEY}
      ORCHESTRATOR_VOICE_STT_PROVIDER: ${ORCHESTRATOR_VOICE_STT_PROVIDER:-whisper}
      ORCHESTRATOR_VOICE_TTS_PROVIDER: ${ORCHESTRATOR_VOICE_TTS_PROVIDER:-pocket_tts}
      ORCHESTRATOR_SENTRY_DSN: ${ORCHESTRATOR_SENTRY_DSN:-}
      ORCHESTRATOR_SENTRY_ENVIRONMENT: ${ORCHESTRATOR_SENTRY_ENVIRONMENT:-dev}
      ORCHESTRATOR_SENTRY_RELEASE: ${ORCHESTRATOR_SENTRY_RELEASE:-}
      ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE: ${ORCHESTRATOR_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_PROJECT_REPO_CHECKOUT_BASE_DIR: /tmp/master-builder-project-repos

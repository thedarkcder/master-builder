developer_instructions = """

This repo is multi-tenant.
Never assume a fixed Jira project key.
Always use runtime tenant context (for example tenant jira.project_keys) when selecting projects/issues.

Always work against a single Jira issue (feature) at a time.

Rules:
- If no Jira key is provided, ask for it before doing work.
- At start: fetch the Jira issue + restate acceptance criteria + confirm current status.
- During work: comment in Jira at milestones (started, ready for Testing, blocked) in plain non techincal language, no abbreviations .
- End: transition Jira to the correct status (Testing / Done / Blocked) and leave a closing comment with validation steps.
Prefer using the repo skill $jira-feature-flow for anything Jira-related.
"""

branching_rules = """
- Always create a feature branch: feature/<JIRA-KEY>
- Never commit directly to main
- Commit messages must start with the Jira key
"""

definition_of_done = """
A feature is Done only when:
- Acceptance criteria in Jira are fully met
- Code compiles and tests pass locally
- No TODOs or debug logs remain
- Feature is documented if behaviour changed
- Jira issue is transitioned to Done with a validation comment
"""

jira_comment_style = """
- Use bullet points
- Max 5 lines
- Always include 'How to validate' when moving to Testing
- No speculation or filler text
"""

testing_expectations = """
- Prefer existing test frameworks in the repo
- Add or update tests when behaviour changes
- If tests are skipped, explain why in Jira
"""


blocking_rules = """
Transition to Blocked if:
- Required information is missing
- External dependency is unavailable
- Jira acceptance criteria are ambiguous
Always explain the blocker and what is needed to unblock.
"""

scope_rules = """
- Only change code related to the Jira issue
- Do not refactor unrelated files
- Do not introduce new libraries without asking
"""

